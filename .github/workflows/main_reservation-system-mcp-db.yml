# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# Seb Harvey


name: Build and deploy - MCP Database Tool

on:
  push:
    branches: [ main ]
    paths:
      - 'src/API/Tools/ReservationSystem.Tools.DatabaseMcp/**'
      - 'src/API/Shared/**'
      - 'src/API/ReservationSystem.sln'
      - '.github/workflows/main_reservation-system-mcp-db.yml'

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src/API/Tools/ReservationSystem.Tools.DatabaseMcp'
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Resolve Project Dependencies Using Dotnet'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet build --configuration Release
          dotnet test --no-build --configuration Release
          dotnet publish --no-build --configuration Release --output ./output
          popd

      - name: 'Check for vulnerable NuGet packages'
        shell: bash
        run: |
          if dotnet list '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}' package --vulnerable --include-transitive 2>&1 | grep -qEi '(Critical|High)'; then
            echo '::error::Critical or High severity vulnerable NuGet packages detected — update affected packages before deploying'
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_390A72EECBF34B47956324B34CAB30AA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2DADBF12B3994905A9352139DC3FE9D5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_751AF3A40764475389865273269A6210 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'reservation-system-mcp-db'
          slot-name: 'Production'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
